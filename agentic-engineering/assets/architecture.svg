<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Human-controlled agentic engineering</title>
  <desc id="desc">Repository context informs a primary agent, which coordinates bounded specialists and approved read-only tools. Deterministic checks produce evidence for a human approval decision.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#17233d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#58a6ff"/>
    </marker>
    <style>
      .box { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 12; }
      .check { stroke: #3fb950; }
      .human { stroke: #d2a8ff; }
      .line { fill: none; stroke: #58a6ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .head { fill: #f0f6fc; font: 700 21px system-ui, sans-serif; }
      .label { fill: #c9d1d9; font: 16px system-ui, sans-serif; }
      .small { fill: #8b949e; font: 15px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="960" height="520" fill="url(#background)" rx="18"/>
  <text x="34" y="38" class="head">Agentic engineering: evidence flows to a human</text>
  <rect x="30" y="75" width="248" height="102" class="box"/>
  <text x="48" y="111" class="head">Repository context</text>
  <text x="48" y="137" class="label">Spec, instructions, code</text>
  <text x="48" y="159" class="small">Constraints are not permissions</text>
  <rect x="345" y="75" width="270" height="102" class="box"/>
  <text x="363" y="111" class="head">Primary agent</text>
  <text x="363" y="137" class="label">Plan, own integration, stop</text>
  <text x="363" y="159" class="small">Human approves plan and actions</text>
  <rect x="682" y="75" width="248" height="102" class="box"/>
  <text x="700" y="111" class="head">Specialists</text>
  <text x="700" y="137" class="label">Research, test, review</text>
  <text x="700" y="159" class="small">Bounded scope and handoffs</text>
  <path d="M278 126H342" class="line"/>
  <path d="M615 126H679" class="line"/>
  <rect x="30" y="238" width="248" height="98" class="box"/>
  <text x="48" y="274" class="head">Approved tools</text>
  <text x="48" y="300" class="label">Local mock MCP: read-only</text>
  <text x="48" y="322" class="small">Observe provenance and output</text>
  <rect x="345" y="238" width="270" height="98" class="box check"/>
  <text x="363" y="274" class="head">Deterministic checks</text>
  <text x="363" y="300" class="label">Rule, tests, CI, policy</text>
  <text x="363" y="322" class="small">Run, do not just request</text>
  <rect x="682" y="238" width="248" height="98" class="box check"/>
  <text x="700" y="274" class="head">Evidence</text>
  <text x="700" y="300" class="label">Diff, results, risks</text>
  <text x="700" y="322" class="small">Unverified stays unverified</text>
  <path d="M395 177L246 235" class="line"/>
  <path d="M480 177V235" class="line"/>
  <path d="M806 177V235" class="line"/>
  <path d="M278 287H342" class="line"/>
  <path d="M615 287H679" class="line"/>
  <rect x="345" y="398" width="270" height="84" class="box human"/>
  <text x="363" y="434" class="head">Human approval</text>
  <text x="363" y="461" class="label">Accept, hold, merge later</text>
  <path d="M806 336C806 376 626 376 598 395" class="line"/>
</svg>
